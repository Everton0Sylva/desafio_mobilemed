<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>{{ id ? 'Edição' : 'Cadastro' }} de Exame</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="row">
      <!-- Paciente -->
      <div class="col-md-6 mb-3">
        <label for="pacienteId" class="form-label">Paciente <span class="text-danger">*</span></label>
        <select id="pacienteId" formControlName="pacienteId" class="form-select"
          [class.is-invalid]="form.get('pacienteId')?.invalid && form.get('pacienteId')?.touched">
          <option [ngValue]="null" disabled>Selecione um paciente</option>
          <option *ngFor="let paciente of pacientes" [ngValue]="paciente.id">{{ paciente.nome }}</option>
        </select>
        <div *ngIf="form.get('pacienteId')?.invalid && form.get('pacienteId')?.touched" class="invalid-feedback">
          Paciente é obrigatório.
        </div>
      </div>

      <!-- Procedimento -->
      <div class="col-md-6 mb-3">
        <label for="idProcedimento" class="form-label">Procedimento <span class="text-danger">*</span></label>
        <select id="idProcedimento" formControlName="idProcedimento" class="form-select"
          [class.is-invalid]="form.get('idProcedimento')?.invalid && form.get('idProcedimento')?.touched">
          <option [ngValue]="null" disabled>Selecione um procedimento</option>
          <option *ngFor="let procedimento of procedimentos" [ngValue]="procedimento.id">{{ procedimento.nome }}</option>
        </select>
        <div *ngIf="form.get('idProcedimento')?.invalid && form.get('idProcedimento')?.touched" class="invalid-feedback">
          Procedimento é obrigatório.
        </div>
      </div>

      <!-- Status -->
      <div class="col-md-6 mb-3">
        <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
        <select id="status" formControlName="status" class="form-select"
          [class.is-invalid]="form.get('status')?.invalid && form.get('status')?.touched">
          <option [ngValue]="null" disabled>Selecione um status</option>
          <option *ngFor="let statusOpt of situacaoExameOptions" [ngValue]="statusOpt.value">{{ statusOpt.label }}</option>
        </select>
        <div *ngIf="form.get('status')?.invalid && form.get('status')?.touched" class="invalid-feedback">
          Status é obrigatório.
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-4">
      <button type="button" class="btn btn-secondary me-2" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Salvar</button>
    </div>
  </form>
</div>
