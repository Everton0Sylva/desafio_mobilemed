<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>{{ id ? 'Edição' : 'Cadastro' }} de Exame</h2>
  </div>

  <div class="row">
    <div class="col-md-6">
      <label for="pacienteFilter" class="form-label">Selecionar Paciente</label>
      <input
        class="form-control"
        id="pacienteFilter"
        type="text"
        [(ngModel)]="searchPaciente"
        placeholder="Digite o Nome ou CPF do Paciente"
        typeaheadOptionField="nome"
        [typeahead]="pacientesList$"
        [typeaheadAsync]="true"
        [typeaheadMinLength]="3"
        (typeaheadOnSelect)="onSelectPaciente($event)"
        [typeaheadWaitMs]="500"
      />
    </div>

    <div class="col-md-6">
      <label for="procedimentoFilter" class="form-label"
        >Selecionar Procedimento <span class="text-danger">*</span></label
      >
      <input
        [(ngModel)]="searchProcedimento"
        placeholder="Digite o Nome, CBO ou Tuss do Procedimento"
        typeaheadOptionField="nome"
        [typeahead]="procedimentosList$"
        [typeaheadAsync]="true"
        [typeaheadMinLength]="3"
        [typeaheadWaitMs]="500"
        (typeaheadOnSelect)="onSelectProcedimento($event)"
        id="procedimentoFilter"
        class="form-control"
      />
    </div>
  </div>

  <div class="d-flex justify-content-end mt-4">
    <button type="button" class="btn btn-secondary me-2" (click)="onCancel()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="onSubmit()">Salvar</button>
  </div>
</div>
